name: clang-tidy-review
on:
  pull_request_target:
    types: [opened]

jobs:
  clang-tidy-check:
    runs-on: ubuntu-24.04

    steps:
      - name: Install basic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget pkg-config

      - name: Setup vcpkg
        run: |
          if [ ! -d ~/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
            ~/vcpkg/bootstrap-vcpkg.sh
          fi
          ~/vcpkg/vcpkg integrate install
          echo "VCPKG_ROOT=~/vcpkg" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: ZedThree/clang-tidy-review@v0.14.0
        with:
          source: '.'
          build_dir: 'build/unixlike-gcc-debug'
          cmake_args: '--preset unixlike-gcc-debug'
          split_worflow: true
      - uses: ZedThree/clang-tidy-review/upload@v0.14.0

name: clang-tidy-comment
on:
  workflow_run:
    workflows: ["clang-tidy-review"]
    types:
      - completed

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: ZedThree/clang-tidy-review/post@v0.14.0
        # lgtm_comment_body, max_comments, and annotations need to be set on the posting workflow in a split setup
        with:
          # adjust options as necessary
          lgtm_comment_body: ''
          annotations: false
          max_comments: 10
