name: Release
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-2022
    strategy:
      matrix:
        compiler: [msvc]
        include:
          - compiler: msvc
            preset: windows-msvc-release
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version from tag
        id: get_version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install NSIS
        run: choco install nsis -y

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}
        env:
          VCPKG_ROOT: C:\vcpkg

      - name: Build
        run: cmake --build build/${{ matrix.preset }} --config Release

      - name: Package
        run: |
          cd build/${{ matrix.preset }}
          cpack -G NSIS
          cpack -G ZIP

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            ./build/${{ matrix.preset }}/libzero-${{ steps.get_version.outputs.version }}-win64.zip
            ./build/${{ matrix.preset }}/libzero-${{ steps.get_version.outputs.version }}-win64.exe

  build-linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [gcc]
        include:
          - compiler: gcc
            version: 13
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget tar zip unzip cmake pkg-config
          sudo apt-get install -y gcc-${{ matrix.version }} g++-${{ matrix.version }}
          sudo apt-get install -y rpm

      - name: Setup vcpkg
        run: |
          if [ ! -d ~/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
            ~/vcpkg/bootstrap-vcpkg.sh
          fi
          ~/vcpkg/vcpkg integrate install
          echo "VCPKG_ROOT=~/vcpkg" >> $GITHUB_ENV

      - name: Configure CMake
        run: cmake --preset unixlike-${{ matrix.compiler }}-release

      - name: Build
        run: cmake --build build/unixlike-${{ matrix.compiler }}-release --config Release

      - name: Package
        run: |
          cd build/unixlike-${{ matrix.compiler }}-release
          cpack -G DEB
          cpack -G RPM
          cpack -G TGZ

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            ./build/unixlike-${{ matrix.compiler }}-release/libzero-${{ steps.get_version.outputs.version }}-linux-amd64.deb
            ./build/unixlike-${{ matrix.compiler }}-release/libzero-${{ steps.get_version.outputs.version }}-linux-amd64.rpm
            ./build/unixlike-${{ matrix.compiler }}-release/libzero-${{ steps.get_version.outputs.version }}-linux-amd64.tar.gz

  create-and-upload:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ needs.build-windows.outputs.version }}
          draft: false
          prerelease: false

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/windows-packages/*
            artifacts/linux-packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}